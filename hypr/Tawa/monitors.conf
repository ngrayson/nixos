# Tawa (desktop) — Hyprland outputs + workspace placement.
# Edit with hyprmon: `hyprmon-cfg` (uses `$(hostname)` → this path), then rebuild.
# Other hosts: add `hypr/<hostname>/monitors.conf` only if that machine needs a fixed layout.

monitor=DP-3,2560x1440@59.95100,0x0,1.00,transform,3
# Center at 144 Hz (its own mode): Melee stays 60 fps, but each frame is scanned out
# sooner, ~8 ms less display wait. The rotated sides stay at 60.
monitor=HDMI-A-1,2560x1440@143.91,1440x544,1.00
monitor=DP-1,2560x1440@59.95100,4000x0,1.00,transform,1

# Workspace 1 on center (HDMI); 2 = right (DP-1); 3 = left (DP-3).
workspace = 1, monitor:HDMI-A-1
workspace = 2, monitor:DP-1
workspace = 3, monitor:DP-3
